[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aw-report"
version = "0.1.0"
description = "Timesheet report generator correlating ActivityWatch and Taskwarrior data"
authors = [{name = "Emir Herrera González", email = "emir.herrera@gmail.com"}]
readme = "README.md"
requires-python = ">=3.14"
license = "LicenseRef-Proprietary"
classifiers = ["Programming Language :: Python :: 3.14"]
dependencies = [
    "aw-client>=0.5.15",
    "aw-core>=0.5.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
aw-report = "tw_report.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
packages = ["tw_report"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "error",
    # Deprecated, production-unused APIs (see tw_report.utils.deprecation). Tests that cover
    # them assert the warning with pytest.deprecated_call (tests/unit/test_deprecations.py).
    "ignore:Not used by the report pipeline:DeprecationWarning",
    "ignore:Private helper of deprecated:DeprecationWarning",
    "ignore:Not called by the CLI:DeprecationWarning",
    "ignore:Category-based layout:DeprecationWarning",
]
markers = [
    "live_server: requires a running ActivityWatch server on localhost",
]

[tool.coverage.run]
branch = true
source = ["src/tw_report"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Ratchet: raised after each phase, must reach 100 at the end of Phase 2.
fail_under = 100
